# CodeDeploy (EC2) - redemarre le conteneur de l'API avec la nouvelle image.
version: 0.0
os: linux
files:
  - source: /
    destination: /opt/teamchat/deploy
file_exists_behavior: OVERWRITE
hooks:
  BeforeInstall:
    - location: scripts/before_install.sh
      timeout: 60
      runas: root
  ApplicationStart:
    - location: scripts/start.sh
      timeout: 300
      runas: root
  ValidateService:
    - location: scripts/validate.sh
      timeout: 120
      runas: root
