name: teamchat

services:
  postgres:
    image: postgres:16-alpine
    container_name: teamchat-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-teamchat}
      POSTGRES_USER: ${POSTGRES_USER:-teamchat}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-teamchat_dev_only}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-teamchat} -d ${POSTGRES_DB:-teamchat}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: teamchat-api
    profiles: ["app"]
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Default: Host=postgres;Port=5432;Database=${POSTGRES_DB:-teamchat};Username=${POSTGRES_USER:-teamchat};Password=${POSTGRES_PASSWORD:-teamchat_dev_only}
      Jwt__Issuer: ${Jwt__Issuer:-teamchat}
      Jwt__Audience: ${Jwt__Audience:-teamchat}
      Jwt__Secret: ${Jwt__Secret:-change-me-please-use-a-long-random-secret-min-32-chars}
      Cors__AllowedOrigins: ${Cors__AllowedOrigins:-http://localhost:4200}
      Redis__ConnectionString: ${Redis__ConnectionString:-}
      Admin__SeedEmail: ${Admin__SeedEmail:-}
      Admin__SeedPassword: ${Admin__SeedPassword:-}
      Storage__Provider: ${Storage__Provider:-Local}
      Storage__LocalPath: /app/uploads
      Turn__StunUrls: ${Turn__StunUrls:-stun:stun.l.google.com:19302}
      Turn__Urls: ${TURN_URLS:-turn:localhost:3478}
      Turn__Secret: ${TURN_SECRET:-teamchat_turn_dev_only}
    ports:
      - "${API_PORT:-5285}:8080"
    volumes:
      - api-uploads:/app/uploads

  redis:
    image: redis:7-alpine
    container_name: teamchat-redis
    profiles: ["redis"]
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  coturn:
    image: coturn/coturn:4.6-alpine
    container_name: teamchat-coturn
    profiles: ["turn"]
    restart: unless-stopped
    command:
      - --no-cli
      - --fingerprint
      - --use-auth-secret
      - --static-auth-secret=${TURN_SECRET:-teamchat_turn_dev_only}
      - --realm=${TURN_REALM:-teamchat.local}
      - --listening-port=3478
      - --min-port=49160
      - --max-port=49200
      - --no-tls
      - --no-dtls
    ports:
      - "${TURN_PORT:-3478}:3478/udp"
      - "${TURN_PORT:-3478}:3478/tcp"
      - "49160-49200:49160-49200/udp"

volumes:
  postgres-data:
  redis-data:
  api-uploads:
