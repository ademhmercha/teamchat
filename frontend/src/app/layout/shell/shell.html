<div class="shell">
  <aside class="sidebar">
    <div class="brand">
      <span class="brand-mark"><app-icon name="conversations" [size]="20" /></span>
      <span class="brand-name">TeamChat</span>
    </div>

    <nav class="nav">
      <a routerLink="/conversations" routerLinkActive="active" class="nav-link" tcTooltip="Messages">
        <app-icon name="conversations" [size]="19" />
        <span class="nav-label">Messages</span>
      </a>
      <a routerLink="/directory" routerLinkActive="active" class="nav-link" tcTooltip="Annuaire">
        <app-icon name="directory" [size]="19" />
        <span class="nav-label">Annuaire</span>
      </a>
    </nav>

    @if (isAdmin()) {
      <nav class="nav nav-admin">
        <span class="nav-title">Administration</span>
        <a
          routerLink="/admin"
          routerLinkActive="active"
          [routerLinkActiveOptions]="{ exact: true }"
          class="nav-link"
          tcTooltip="Tableau de bord"
        >
          <app-icon name="dashboard" [size]="19" />
          <span class="nav-label">Tableau de bord</span>
        </a>
        <a routerLink="/admin/users" routerLinkActive="active" class="nav-link" tcTooltip="Utilisateurs">
          <app-icon name="users" [size]="19" />
          <span class="nav-label">Utilisateurs</span>
        </a>
        <a routerLink="/admin/groups" routerLinkActive="active" class="nav-link" tcTooltip="Groupes">
          <app-icon name="conversations" [size]="19" />
          <span class="nav-label">Groupes</span>
        </a>
      </nav>
    }

    <div class="sidebar-foot">
      <div class="me">
        <tc-avatar [name]="user()?.displayName ?? ''" size="md" [online]="true" />
        <div class="me-info">
          <span class="me-name">{{ user()?.displayName }}</span>
          <tc-badge variant="neutral">{{ user()?.role }}</tc-badge>
        </div>
        <button
          type="button"
          class="icon-btn"
          tcTooltip="Déconnexion"
          (click)="logout()"
        >
          <app-icon name="logout" [size]="18" />
        </button>
      </div>
    </div>
  </aside>

  <div class="main">
    <header class="topbar">
      <form class="global-search" (submit)="submitSearch($event)" role="search">
        <app-icon name="search" [size]="17" />
        <input
          #searchInput
          type="search"
          placeholder="Rechercher des collègues…"
          [value]="searchTerm()"
          (input)="onSearchInput($event)"
          aria-label="Recherche globale"
        />
        <kbd>⌘K</kbd>
      </form>

      <div class="topbar-actions">
        <button type="button" class="topbar-icon" tcTooltip="Notifications">
          <app-icon name="bell" [size]="19" />
        </button>
        <div class="account">
          <tc-avatar [name]="user()?.displayName ?? ''" size="sm" />
          <div class="account-info">
            <span class="account-name">{{ user()?.displayName }}</span>
            <span class="account-role">{{ user()?.role }}</span>
          </div>
        </div>
      </div>
    </header>

    <section class="content">
      <router-outlet />
    </section>
  </div>

  <app-call-overlay />
</div>
