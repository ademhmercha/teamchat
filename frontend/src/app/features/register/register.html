<div class="register-page">
  <form class="register-card" [formGroup]="form" (ngSubmit)="submit()" novalidate>
    <header class="register-header">
      <div class="brand-mark"><app-icon name="conversations" [size]="26" /></div>
      <h1>Créer ma société</h1>
      <p>Un espace totalement isolé pour votre équipe.</p>
    </header>

    @if (error(); as message) {
      <div class="alert" role="alert">{{ message }}</div>
    }

    <label class="field">
      <span>Nom de la société</span>
      <input type="text" formControlName="companyName" autocomplete="organization" placeholder="Acme SARL" />
      @if (form.controls.companyName.touched && form.controls.companyName.invalid) {
        <small class="field-error">Le nom de la société est obligatoire.</small>
      }
    </label>

    <label class="field">
      <span>Votre nom</span>
      <input type="text" formControlName="displayName" autocomplete="name" placeholder="Prénom Nom" />
      @if (form.controls.displayName.touched && form.controls.displayName.invalid) {
        <small class="field-error">Votre nom est obligatoire.</small>
      }
    </label>

    <label class="field">
      <span>Email</span>
      <input type="email" formControlName="email" autocomplete="username" placeholder="prenom.nom@societe.com" />
      @if (form.controls.email.touched && form.controls.email.invalid) {
        <small class="field-error">Email invalide.</small>
      }
    </label>

    <label class="field">
      <span>Mot de passe</span>
      <input type="password" formControlName="password" autocomplete="new-password" placeholder="••••••••" />
      @if (form.controls.password.touched && form.controls.password.invalid) {
        <small class="field-error">
          8 caractères minimum, avec majuscule, minuscule, chiffre et caractère spécial.
        </small>
      }
    </label>

    <tc-button variant="primary" type="submit" [block]="true" [loading]="loading()">
      {{ loading() ? 'Création…' : 'Créer ma société' }}
    </tc-button>

    <p class="switch-link">
      Vous avez déjà un compte ?
      <a routerLink="/login">Se connecter</a>
    </p>
  </form>
</div>
