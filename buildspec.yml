version: 0.2

env:
  variables:
    DOTNET_CLI_TELEMETRY_OPTOUT: "1"
    DOTNET_NOLOGO: "1"
    RUN_INTEGRATION_TESTS: "true"
    ECR_SCAN_FAIL_ON_CRITICAL: "true"
    ECR_SCAN_IGNORED_CVES: ""

phases:
  install:
    runtime-versions:
      nodejs: 22
      dotnet: 10.0
    commands:
      - dotnet --version
      - node --version
      - mkdir -p backend/test-results/unit backend/test-results/integration

  pre_build:
    commands:
      - ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
      - REGISTRY="$ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com"
      - IMAGE_TAG=$(echo "$CODEBUILD_RESOLVED_SOURCE_VERSION" | cut -c1-7)
      - IMAGE_URI="$REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
      - aws ecr get-login-password --region "$AWS_DEFAULT_REGION" | docker login --username AWS --password-stdin "$REGISTRY"

  build:
    commands:
      - dotnet restore backend/TeamChat.sln
      - dotnet build backend/TeamChat.sln -c Release --no-restore
      - >-
        dotnet test backend/tests/TeamChat.UnitTests -c Release --no-build
        --logger "trx;LogFileName=unit.trx" --results-directory backend/test-results/unit
      - |
        if [ "$RUN_INTEGRATION_TESTS" = "true" ]; then
          dotnet test backend/tests/TeamChat.IntegrationTests -c Release --no-build \
            --logger "trx;LogFileName=integration.trx" --results-directory backend/test-results/integration
        else
          echo "Tests d'integration ignores (RUN_INTEGRATION_TESTS=$RUN_INTEGRATION_TESTS)."
        fi
      - docker build -t "$IMAGE_URI" -t "$REGISTRY/$ECR_REPOSITORY:latest" ./backend
      - |
        if [ -n "${GOOGLE_CLIENT_ID:-}" ]; then
          sed -i "s|googleClientId: ''|googleClientId: '${GOOGLE_CLIENT_ID}'|" frontend/src/environments/environment.production.ts
          grep -q "googleClientId: '${GOOGLE_CLIENT_ID}'" frontend/src/environments/environment.production.ts
        else
          echo "GOOGLE_CLIENT_ID absent : connexion Google desactivee dans le frontend."
        fi
      - cd frontend && npm ci && npm run build -- --configuration production && cd ..

  post_build:
    commands:
      - if [ "$CODEBUILD_BUILD_SUCCEEDING" != "1" ]; then echo "Build en echec, rien n'est publie."; exit 1; fi
      - docker push "$IMAGE_URI"
      - bash aws/scripts/check-ecr-scan.sh "$ECR_REPOSITORY" "$IMAGE_TAG"
      - docker push "$REGISTRY/$ECR_REPOSITORY:latest"
      - >-
        aws s3 sync frontend/dist/frontend/browser "s3://$FRONTEND_BUCKET" --delete
        --cache-control "public,max-age=31536000,immutable"
        --exclude "index.html" --exclude "ngsw.json" --exclude "ngsw-worker.js"
        --exclude "safety-worker.js" --exclude "worker-basic.min.js" --exclude "manifest.webmanifest"
        --exclude "maintenance.html" --exclude "maintenance-config.json"
        --exclude "privacy.html" --exclude "terms.html"
      - >-
        for f in index.html ngsw.json ngsw-worker.js safety-worker.js worker-basic.min.js manifest.webmanifest maintenance.html privacy.html terms.html; do
        if [ -f "frontend/dist/frontend/browser/$f" ]; then
        aws s3 cp "frontend/dist/frontend/browser/$f" "s3://$FRONTEND_BUCKET/$f" --cache-control "no-cache"; fi; done
      - aws cloudfront create-invalidation --distribution-id "$CLOUDFRONT_DISTRIBUTION_ID" --paths "/index.html" "/ngsw.json" "/manifest.webmanifest"
      - echo "IMAGE_URI=$IMAGE_URI" > aws/codedeploy/image.env
      - echo "AWS_REGION=$AWS_DEFAULT_REGION" >> aws/codedeploy/image.env

reports:
  unit-tests:
    files:
      - "**/*.trx"
    base-directory: backend/test-results/unit
    file-format: VISUALSTUDIOTRX
  integration-tests:
    files:
      - "**/*.trx"
    base-directory: backend/test-results/integration
    file-format: VISUALSTUDIOTRX

artifacts:
  base-directory: aws/codedeploy
  files:
    - '**/*'

cache:
  paths:
    - /root/.nuget/packages/**/*
    - /root/.npm/**/*
